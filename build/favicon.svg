<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="50%" stop-color="#ff7b54" />
      <stop offset="100%" stop-color="#ffa366" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ff4b72" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer glowing rounded container for contrast in dark and light browser chrome -->
  <rect width="32" height="32" rx="8" fill="#0f1420" />
  
  <g transform="translate(4, 4) scale(1)" filter="url(#glow)">
    <!-- Butterfly Body -->
    <path
      d="M12 4c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5s-1.5-.7-1.5-1.5v-13C10.5 4.7 11.2 4 12 4z"
      fill="url(#wingGrad)"
    />
    <!-- Right Wings -->
    <path
      d="M12 6c2.5-4.5 10-3 10 4.5 0 5.5-6.5 8.5-10 8.5V6z"
      fill="url(#wingGrad)"
      fill-opacity="0.9"
    />
    <!-- Left Wings -->
    <path
      d="M12 6c-2.5-4.5-10-3-10 4.5 0 5.5 6.5 8.5 10 8.5V6z"
      fill="url(#wingGrad)"
      fill-opacity="0.9"
    />
    <!-- Antennae -->
    <circle cx="9.5" cy="4" r="1.1" fill="url(#wingGrad)" />
    <circle cx="14.5" cy="4" r="1.1" fill="url(#wingGrad)" />
  </g>
</svg>
